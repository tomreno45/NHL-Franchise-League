<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060d13" />
    <!-- Without this, "Add to Home Screen" on iOS just creates a Safari
         bookmark — the page still opens inside Safari's browser chrome, not
         as a standalone app. Web Push on iOS only ever gets delivered to a
         page running in that standalone context (see push.js/Notifications.jsx
         for the client-side half of this), so a device without this tag can
         grant notification permission and successfully subscribe and still
         never receive a single push. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HFL" />
    <title>Hockey Franchise League</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
